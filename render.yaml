services:
  - type: web
    name: fraudmesh
    env: python
    buildCommand: "cd web && npm install && npm run build && cd ../api && pip install -r requirements.txt"
    startCommand: "cd api && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
